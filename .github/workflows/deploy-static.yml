name: Deploy approved static GitHub Pages website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published static files
        uses: actions/checkout@v4
      - name: Verify public site's ROOT index and privacy
        run: |
          test -s index.html
          test -s assets/connell-portrait.jpg
          grep -q 'id="publications"' index.html
          test "$(grep -o '<h1' index.html | wc -l)" -eq 1
          if find . -type f \( -name '*.bib' -o -name '*.qmd' -o -name '*.py' -o -name 'papers.json' -o -name 'candidates.json' -o -name 'discovered.json' -o -name 'sources.json' -o -name '*.pem' \) -not -path './.git/*' | grep .; then
            echo "ERROR: Private source or bibliography found in public website."
            exit 1
          fi
          if grep -RIl --include='*.html' -E 'publications/(papers|connell)\.bib|publications/(candidates|discovered|papers)\.json' . --exclude-dir=.git; then
            echo "ERROR: Public HTML references private bibliography files."
            exit 1
          fi
      - name: Stage only static site content for Pages
        run: |
          mkdir -p "$RUNNER_TEMP/pages-root"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='README.md' \
            ./ "$RUNNER_TEMP/pages-root/"
          test -s "$RUNNER_TEMP/pages-root/index.html"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site from the public ROOT
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-root
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # The artifact upload can finish before the Pages lookup sees it.
      - name: Allow the Pages artifact to become visible
        run: sleep 20
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
