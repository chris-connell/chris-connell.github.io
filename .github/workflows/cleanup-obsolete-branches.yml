name: One-time removal of obsolete public source branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-old-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete obsolete branches that expose old source files
        run: |
          set -e
          git push origin --delete bibtex-source-of-truth
          git push origin --delete publication-sources-split
