name: Publish academic website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install bibliography parser
        run: python -m pip install -r requirements.txt
      - name: Generate bibliography and refresh scholarly sources
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/sync_publications.py
          else
            python scripts/sync_publications.py --discover
          fi
      - name: Commit generated records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/papers.bib publications/papers.json publications/_list.qmd publications/candidates.json publications/discovered.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh publication records"
            git push
          fi
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: quarto render
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
