name: Render safe static website snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render website using existing verified publication list
        run: quarto render
      - name: Remove any private source files from static output
        run: |
          test -s _site/index.html
          test -s _site/publications.html
          find _site -type f \( -name '*.bib' -o -name '*.py' -o -name '*.qmd' -o -name 'papers.json' -o -name 'candidates.json' -o -name 'discovered.json' -o -name 'sources.json' \) -print -delete
          if grep -RIl --include='*.html' -E 'publications/(papers|connell)\.bib|publications/(candidates|discovered|papers)\.json' _site; then
            echo "ERROR: Bibliography links found in website HTML."
            exit 1
          fi
      - name: Save approved rendered files as versioned static site
        run: |
          mkdir -p site
          rsync -a --delete _site/ site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if ! git diff --cached --quiet; then
            git commit -m "Save clean static GitHub Pages snapshot"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
