name: Publish academic website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh reviewed publications and discover candidates
        run: python scripts/sync_publications.py

      - name: Save synchronized publication metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/papers.bib publications/papers.json publications/_list.qmd publications/candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update scholarly bibliography"
            git push
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload rendered website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
